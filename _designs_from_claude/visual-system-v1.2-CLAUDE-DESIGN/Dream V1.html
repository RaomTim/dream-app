<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream — V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- SVG noise defs (matter) — referenced as background-image url(#…) via inline svg -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="noise-linen"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.72  0 0 0 0 0.68  0 0 0 0.06 0"/></filter>
    <filter id="noise-paper"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 0.72  0 0 0 0 0.68  0 0 0 0 0.62  0 0 0 0.08 0"/></filter>
    <filter id="noise-stone"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 0.52  0 0 0 0 0.55  0 0 0 0 0.6  0 0 0 0.1 0"/></filter>
    <filter id="noise-ash"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="1"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0 0.4  0 0 0 0.03 0"/></filter>
    <filter id="noise-water"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.55  0 0 0 0 0.66  0 0 0 0.07 0"/></filter>
    <filter id="noise-ember"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.7  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.06 0"/></filter>
    <filter id="noise-silk"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.78  0 0 0 0 0.7  0 0 0 0 0.5  0 0 0 0.05 0"/></filter>
    <filter id="noise-earth"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="6"/><feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.08 0"/></filter>
  </defs>
</svg>

<!-- Fixed night sky (ash grain) -->
<div class="sky">
  <svg width="100%" height="100%" preserveAspectRatio="none" style="display:block">
    <rect width="100%" height="100%" filter="url(#noise-ash)" />
  </svg>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="screens-shared.jsx"></script>
<script type="text/babel" src="screens-core.jsx"></script>
<script type="text/babel" src="screens-deep.jsx"></script>
<script type="text/babel" src="screens-cercle.jsx"></script>
<script type="text/babel" src="screens-anima.jsx"></script>
<script type="text/babel" src="screens-soma.jsx"></script>
<script type="text/babel" src="screens-meta.jsx"></script>
<script type="text/babel" src="screens-figure.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
