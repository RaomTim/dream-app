<!-- 2026-04-29 — Bootstrap mobile (Yeshua) :
     1. Unregister tout vieux service worker qui pourrait servir un cache cassé.
        L'app n'enregistre PLUS le SW (sw.js dans /public/ mais jamais register())
        — donc les users qui l'ont enregistré dans une version antérieure ont
        peut-être un cache stale qui sert un index.html cassé pour `/`.
     2. Diagnostic timer : si après 8s React/AuthGate/#root pas prêts, on
        affiche un message lisible au lieu d'un écran noir. -->
<script>
(function dreamBootstrap() {
  // Unregister stale service workers (depuis ancienne version v1.1)
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { try { r.unregister(); } catch (e) {} });
      }).catch(function() {});
    }
  } catch (e) {}

  // 2026-04-29 (Yeshua, FIX P0 mobile #2) — Diag boot enrichi.
  // Babel @standalone supprimé : on check React + ReactDOM (UMD CDN)
  // ET window.AuthGate (premier script app loadé, défini par auth.js).
  // Si AuthGate manque alors que React est là → un script app a échoué
  // silencieusement (404, parse error, etc.). On affiche le fallback.
  // Aussi : on check que #root a au moins un enfant (App monté).
  setTimeout(function () {
    var rootEl = document.getElementById("root");
    var ok = typeof window.React !== "undefined"
          && typeof window.ReactDOM !== "undefined"
          && typeof window.AuthGate !== "undefined"
          && rootEl && rootEl.children.length > 0;
    if (!ok) {
      var diag = document.getElementById("__dream_boot_diag");
      if (diag) diag.classList.add("show");
      try {
        console.error("[Dream Boot] runtime partiel — React=" + typeof window.React +
          " ReactDOM=" + typeof window.ReactDOM +
          " AuthGate=" + typeof window.AuthGate +
          " rootChildren=" + (rootEl ? rootEl.children.length : "no-root"));
      } catch(_) {}
    }
  }, 8000);
})();
</script>
